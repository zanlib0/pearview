name: Pearview CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.0'
          otp-version: '29.0.1'
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      # Lint
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      # Test (the `test` alias creates and migrates the SQLite test DB)
      - run: mix test

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: git.jerusalem.ovh
          username: justinian
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push
        run: |
          docker buildx build --push \
            -t git.jerusalem.ovh/justinian/pearview:latest \
            -t git.jerusalem.ovh/justinian/pearview:${{ github.sha }} \
            .
